<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dr. Susil Kumar Mohanty</title>
  <script>
    // SPA fallback: encode the sub-path into the query string so index.html
    // can read it and let React Router handle the route.
    // e.g. /~susilmohanty/about  →  /~susilmohanty/?/about
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
